name: skill-gate

# 公开仓库的结构门（业界锤炼②）：每次 push / PR 自动校验 SKILL.md 与 README.md 的
# 结构性契约，失败即挡下。只依赖公开仓库本身资产（SKILL.md / README.md），
# 不引入 evals/、check.ps1 等开发期资产——公开版范围与开发包严格分离。
#
# 检查项（实现见 .github/structure_gate.py，本地可同命令复现）：
#   1) frontmatter 合法，且 name 必须为 young-renter-assistant
#   2) 代码围栏（```）成对闭合
#   3) 无 CRLF 行尾（公开版约定 LF-only）
#   4) README 的「附录 B · 补充说明」存在（workbuddy 改造说明未丢失）
#   5) SKILL 的版本锚点（"当前版本：**X**"）存在
#   6) 表格分隔行列数一致（防 Markdown 表格结构损坏）
#
# 注：v2.6.2 之前本工作流把 python 脚本以 heredoc 内联在 run 里，正文顶格写导致
# YAML 无法解析（6 次 push 全部 startup_failure、jobs 为空），结构门实际从未运行。
# 现改为独立脚本文件，既修好 YAML，也让本地能跑同一条命令。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 结构门
        run: python .github/structure_gate.py
